name: E2E Test

on:
  workflow_dispatch:
    inputs:
      # クラッシュは不定期にしか発生しないため、調査時は同じテストを繰り返し実行できるようにする。
      repeat:
        description: 'E2E テストの繰り返し回数'
        required: false
        default: '1'
      # 調査対象のテストだけを実行したいときに指定する (例: jp.shiguredo.sora.sdk.SoraMessagingE2ETest)。
      test_filter:
        description: '実行するテストクラス (空なら全件)'
        required: false
        default: ''
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'THANKS'
      - '.github/workflows/claude.yml'
      - '.github/copilot-instructions.md'
      - 'sora-android-sdk/packages.md'
      - 'docs/**'
      - 'jitpack.yml'
      - 'canary.py'
      - '.gitignore'

permissions:
  actions: read

jobs:
  e2e:
    runs-on: [self-hosted, macOS, ARM64, Apple-M1]
    timeout-minutes: 45
    env:
      TEST_SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      TEST_CHANNEL_ID_SUFFIX: _${{ github.run_id }}
      ANDROID_SDK_ROOT: /opt/android-sdk
      ADB_PATH: /opt/android-sdk/platform-tools/adb
      # push では inputs が空になるため、既定値へフォールバックする。
      E2E_REPEAT: ${{ github.event.inputs.repeat || '1' }}
      E2E_TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Homebrew to PATH
        # runner から brew の gpg を利用するためにパスを渡す。
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          # macOS arm64 の self-hosted runner でも利用可能な配布元を明示する。
          # runner ローカルの JDK 状態に依存せず、CI では常に JDK 21 を再現する。
          distribution: 'temurin'
          java-version: '21'
      - name: Validate Android SDK
        run: |
          test -n "${ANDROID_SDK_ROOT:-}" || { echo "ANDROID_SDK_ROOT is not set"; exit 1; }
          test -e "$ADB_PATH" || { echo "adb not found at $ADB_PATH"; exit 1; }
          test -x "$ADB_PATH" || { echo "adb not executable at $ADB_PATH"; exit 1; }
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || {
            echo "sdkmanager not found at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          }
      - name: Copy gradle.properties
        run: cp gradle.properties.example gradle.properties
      - name: Validate E2E environment
        run: |
          test -n "${TEST_SORA_SIGNALING_URL:-}" || { echo "TEST_SORA_SIGNALING_URL is not set"; exit 1; }
      - name: Run E2E tests with logcat
        run: |
          set +e

          LOG_DIR="e2e-logs"
          LOGCAT_FILE="$LOG_DIR/logcat.txt"
          ADB_DEVICES_FILE="$LOG_DIR/adb-devices.txt"
          STOP_FILE="$LOG_DIR/stop-watchers"
          rm -rf "$LOG_DIR"
          mkdir -p "$LOG_DIR"

          # デバイスの出現を待って logcat を取得し続ける。
          # Gradle Managed Device / UTP はテスト実行中に adb サーバを再起動するため、
          # 単発の adb logcat はデバイスに接続できないまま終了してしまう。
          # そのためプロセスが終了したら再起動して取得を継続する。
          # フィルタは指定せず全バッファを取得する。クラッシュのスタックは
          # crash / main バッファの AndroidRuntime / DEBUG / libc に出る。
          logcat_watcher() {
            while [ ! -f "$STOP_FILE" ]; do
              "$ADB_PATH" devices -l >> "$ADB_DEVICES_FILE" 2>&1
              local serial
              serial=$("$ADB_PATH" devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')
              if [ -z "$serial" ]; then
                echo "no device yet, retrying" >> "$ADB_DEVICES_FILE"
                sleep 2
                continue
              fi
              # リングバッファを広げて、クラッシュのスタックが上書きされるのを防ぐ。
              "$ADB_PATH" -s "$serial" logcat -G 16M >> "$LOGCAT_FILE" 2>&1
              echo "=== logcat start serial=$serial ===" >> "$LOGCAT_FILE"
              "$ADB_PATH" -s "$serial" logcat -b all -v threadtime >> "$LOGCAT_FILE" 2>&1
              echo "=== logcat exit serial=$serial ===" >> "$LOGCAT_FILE"
              sleep 2
            done
          }
          logcat_watcher &
          LOGCAT_PID=$!

          result=0
          iteration=1
          while [ "$iteration" -le "${E2E_REPEAT}" ]; do
            echo "=== E2E iteration ${iteration}/${E2E_REPEAT} ==="
            if [ -n "${E2E_TEST_FILTER}" ]; then
              ./gradlew :sora-android-sdk:pixelApi35AndroidE2ETest --stacktrace \
                -Pandroid.testInstrumentationRunnerArguments.class="${E2E_TEST_FILTER}" \
                -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
            else
              ./gradlew :sora-android-sdk:pixelApi35AndroidE2ETest --stacktrace \
                -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
            fi
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "=== E2E iteration ${iteration} failed with exit code ${result} ==="
              break
            fi
            iteration=$((iteration + 1))
          done

          touch "$STOP_FILE"
          kill "$LOGCAT_PID" 2>/dev/null || true
          wait "$LOGCAT_PID" 2>/dev/null || true

          # クラッシュのスタックをジョブログから直接読めるようにする。
          echo "=== crash related logcat lines ==="
          grep -a -E "FATAL EXCEPTION|AndroidRuntime|DEBUG|libc|Fatal signal|tombstone|backtrace|SIGSEGV|SIGABRT|SIGILL|lowmemorykiller|Process crashed" "$LOGCAT_FILE" | tail -300 || true
          echo "=== tail of logcat ==="
          tail -100 "$LOGCAT_FILE" || true

          exit "$result"
      - name: Upload E2E diagnostics
        # 成功時も logcat の取得が機能しているかを確認できるようにする。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            e2e-logs/
            sora-android-sdk/build/reports/androidTests/
            sora-android-sdk/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
  slack_notify:
    needs: [e2e]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ needs.e2e.result }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-android-sdk
        env:
          GH_TOKEN: ${{ github.token }}
