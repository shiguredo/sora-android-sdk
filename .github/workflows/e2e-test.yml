name: E2E Test

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'THANKS'
      - '.github/workflows/claude.yml'
      - '.github/copilot-instructions.md'
      - 'sora-android-sdk/packages.md'
      - 'docs/**'
      - 'jitpack.yml'
      - 'canary.py'
      - '.gitignore'

permissions:
  actions: read

jobs:
  e2e:
    runs-on: [self-hosted, macOS, ARM64, Apple-M1]
    timeout-minutes: 45
    env:
      TEST_SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      TEST_CHANNEL_ID_SUFFIX: _${{ github.run_id }}
      ANDROID_SDK_ROOT: /opt/android-sdk
      ADB_PATH: /opt/android-sdk/platform-tools/adb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Homebrew to PATH
        # runner から brew の gpg を利用するためにパスを渡す。
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          # macOS arm64 の self-hosted runner でも利用可能な配布元を明示する。
          # runner ローカルの JDK 状態に依存せず、CI では常に JDK 25 を再現する。
          distribution: 'temurin'
          java-version: '25'
      - name: Validate Android SDK
        run: |
          test -n "${ANDROID_SDK_ROOT:-}" || { echo "ANDROID_SDK_ROOT is not set"; exit 1; }
          test -e "$ADB_PATH" || { echo "adb not found at $ADB_PATH"; exit 1; }
          test -x "$ADB_PATH" || { echo "adb not executable at $ADB_PATH"; exit 1; }
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || {
            echo "sdkmanager not found at $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          }
      - name: Copy gradle.properties
        run: cp gradle.properties.example gradle.properties
      - name: Validate E2E environment
        run: |
          test -n "${TEST_SORA_SIGNALING_URL:-}" || { echo "TEST_SORA_SIGNALING_URL is not set"; exit 1; }
      - name: Run E2E tests with logcat
        run: |
          set +e

          LOG_DIR="e2e-logs"
          LOGCAT_FILE="$LOG_DIR/logcat.txt"
          STOP_FILE="$LOG_DIR/stop-watchers"
          # テストプロセスのログだけを取得し、システムログに含まれる ICCID や private IP を artifact に含めない。
          TEST_PACKAGE_NAME="jp.shiguredo.sora.sdk.test"

          # 前回の実行が残したログを混ぜないように、毎回作り直す。
          rm -rf "$LOG_DIR"
          mkdir -p "$LOG_DIR"

          # Gradle Managed Device / UTP はテスト実行中に adb サーバを再起動することがある。
          # 単発の adb logcat では取得が途切れるため、デバイスの出現を待ち、
          # 取得プロセスが終了するたびに再起動する。
          logcat_watcher() {
            local child_pid=""
            # 停止要求を受けたら、取得中の adb logcat も止めて終了する。
            trap 'if [ -n "$child_pid" ]; then kill "$child_pid" 2>/dev/null || true; fi; exit 0' TERM INT
            while [ ! -f "$STOP_FILE" ]; do
              local serial
              serial=$("$ADB_PATH" devices | awk 'NR > 1 && $2 == "device" { print $1; exit }')
              if [ -z "$serial" ]; then
                # エミュレータの起動を待つ。
                sleep 2
                continue
              fi
              # テストプロセスの起動を待つ。プロセス以外のシステムログは PII を含むため取得しない。
              local test_pid
              test_pid=$("$ADB_PATH" -s "$serial" shell pidof "$TEST_PACKAGE_NAME" 2>/dev/null | tr -d '\r' | awk '{ print $1 }')
              if [ -z "$test_pid" ]; then
                sleep 2
                continue
              fi
              # クラッシュのスタックがリングバッファからあふれないように広げる。
              "$ADB_PATH" -s "$serial" logcat -G 16M >> "$LOGCAT_FILE" 2>&1 || true
              echo "=== logcat start serial=$serial pid=$test_pid ===" >> "$LOGCAT_FILE"
              "$ADB_PATH" -s "$serial" logcat --pid="$test_pid" -b all -v threadtime >> "$LOGCAT_FILE" 2>&1 &
              child_pid=$!
              wait "$child_pid" || true
              child_pid=""
              echo "=== logcat exit serial=$serial pid=$test_pid ===" >> "$LOGCAT_FILE"
              # adb サーバの再起動直後は接続できないため、少し待ってから再試行する。
              sleep 2
            done
          }

          cleanup() {
            # trap の中では $? が変わるため、先頭で終了コードを保存する。
            local result=$?
            # 取得ループを止め、子の adb logcat も終了させる。
            touch "$STOP_FILE" 2>/dev/null || true
            if [ -n "${LOGCAT_PID:-}" ]; then
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
            fi
            # テストプロセスのログにも PII が残るため、保存前に伏せる。
            sed -i '' -E \
              's/iccId=[0-9]+/iccId=<masked>/g; s/10\.0\.2\.[0-9]+/<IP>/g; s#/Users/[^ ]*#<PATH>#g' \
              "$LOGCAT_FILE" 2>/dev/null || true
            # 失敗時だけクラッシュ関連の行と末尾をジョブログへ出力する。
            # 成功時に全量を出力するとジョブログの上限で切り捨てられるため出力しない。
            if [ "$result" -ne 0 ]; then
              echo "=== crash related logcat lines ==="
              grep -a -E "FATAL EXCEPTION|AndroidRuntime|DEBUG|libc|Fatal signal|tombstone|backtrace" "$LOGCAT_FILE" 2>/dev/null | tail -n 300 || true
              echo "=== tail of logcat ==="
              tail -n 100 "$LOGCAT_FILE" 2>/dev/null || true
            fi
            return "$result"
          }
          trap cleanup EXIT

          logcat_watcher &
          LOGCAT_PID=$!

          ./gradlew :sora-android-sdk:pixelApi35AndroidE2ETest --stacktrace
          exit $?
      - name: Upload E2E diagnostics
        # 失敗した run の調査用に logcat とテストレポートを保存する。
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # 再実行の attempt ごとに名前を分け、前 attempt の artifact と衝突させない。
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            e2e-logs/
            sora-android-sdk/build/reports/androidTests/
            sora-android-sdk/build/outputs/androidTest-results/**/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
  slack_notify:
    needs: [e2e]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ needs.e2e.result }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-android-sdk
        env:
          GH_TOKEN: ${{ github.token }}
